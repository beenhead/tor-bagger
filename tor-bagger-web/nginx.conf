upstream backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # GPX uploads and logbook imports come through here; the default 1m is tight.
    client_max_body_size 25m;

    gzip on;
    gzip_types text/css application/javascript application/json;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HSTS is intentionally left off here. TLS terminates at Cloudflare, which
    # has its own HSTS setting, and enabling it makes browsers refuse plain
    # HTTP for the domain for a year — hard to walk back if anything changes.
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # The API lives behind the same origin as the page, so the frontend uses
    # relative /api/... URLs and nothing has to know the public hostname.
    # Trailing slash on proxy_pass strips the /api prefix: /api/tors -> /tors.
    location /api/ {
        proxy_pass http://backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
