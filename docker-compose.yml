# Production-shaped stack. Values come from the .env file in this directory
# (see .env.example). For local development, layer the dev overlay on top:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tor_bagger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-tor_bagger}
    volumes:
      - db_data:/var/lib/postgresql/data
    # Deliberately not published — only the backend needs to reach it, over the
    # internal compose network. Use `docker compose exec db psql` for a shell.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tor_bagger} -d ${POSTGRES_DB:-tor_bagger}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./tor-bagger-backend
    restart: unless-stopped
    environment:
      # Passed as discrete values, not a pre-built URL: the backend assembles
      # the DSN and percent-encodes the password, so "@" or ":" in it can't be
      # mistaken for URL structure.
      POSTGRES_USER: ${POSTGRES_USER:-tor_bagger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-tor_bagger}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in .env}
      WEB_BASE_URL: ${WEB_BASE_URL:?WEB_BASE_URL must be set in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-Tor Bagger <onboarding@resend.dev>}
    # Not published either — nginx proxies /api/ to it inside the network.
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./tor-bagger-web
    restart: unless-stopped
    # Bound to loopback by default: TLS and public ingress are handled by
    # Cloudflare Tunnel, which connects out from this host and reaches the site
    # at http://localhost:80. Nothing needs to be open inbound. Set WEB_BIND to
    # 0.0.0.0 only if you are exposing this host directly instead.
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  db_data:
