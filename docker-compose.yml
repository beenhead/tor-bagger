# Production-shaped stack. Values come from the .env file in this directory
# (see .env.example). For local development, layer the dev overlay on top:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tor_bagger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-tor_bagger}
    volumes:
      - db_data:/var/lib/postgresql/data
    # Deliberately not published — only the backend needs to reach it, over the
    # internal compose network. Use `docker compose exec db psql` for a shell.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tor_bagger} -d ${POSTGRES_DB:-tor_bagger}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./tor-bagger-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tor_bagger}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tor_bagger}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in .env}
      WEB_BASE_URL: ${WEB_BASE_URL:?WEB_BASE_URL must be set in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-Tor Bagger <onboarding@resend.dev>}
    # Not published either — nginx proxies /api/ to it inside the network.
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./tor-bagger-web
    restart: unless-stopped
    # Not published — Caddy reaches it over the internal network.
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN must be set in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates live here. Losing this volume means re-issuing them, and
      # Let's Encrypt rate-limits that, so keep it.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  db_data:
  caddy_data:
  caddy_config:
