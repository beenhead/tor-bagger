# Development overlay — NOT loaded automatically. Use explicitly:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# Named rather than docker-compose.override.yml on purpose: an auto-loading
# override would silently apply --reload and expose the database on a server.
#
# For local use set WEB_PORT=5500 in .env rather than overriding it here:
# compose merges `ports` lists by appending, so an override would publish the
# web container on both ports at once.
services:
  db:
    ports:
      - "5432:5432"

  backend:
    ports:
      - "8000:8000"
    environment:
      # Allows a page opened outside nginx, or the mobile app pointed straight
      # at :8000, to call the API cross-origin.
      CORS_ORIGINS: "*"
      # Effectively off locally: behind the dev nginx every request looks like
      # it came from the nginx container, so one bucket would throttle you while
      # you are clicking through the signup form.
      REGISTER_RATE_LIMIT: "1000/minute"
      LOGIN_RATE_LIMIT: "1000/minute"
      PASSWORD_RESET_RATE_LIMIT: "1000/minute"
    volumes:
      - ./tor-bagger-backend:/app
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
