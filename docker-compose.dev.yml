# Development overlay — NOT loaded automatically. Use explicitly:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# Named rather than docker-compose.override.yml on purpose: an auto-loading
# override would silently apply --reload and expose the database on a server.
#
# Set DOMAIN=localhost in .env for local use: Caddy then issues a certificate
# from its own internal CA instead of trying to reach Let's Encrypt. The web
# container is also published directly on 5500, so you can bypass TLS entirely.
services:
  db:
    ports:
      - "5432:5432"

  backend:
    ports:
      - "8000:8000"
    environment:
      # Allows a page opened outside nginx, or the mobile app pointed straight
      # at :8000, to call the API cross-origin.
      CORS_ORIGINS: "*"
    volumes:
      - ./tor-bagger-backend:/app
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  web:
    ports:
      - "5500:80"
